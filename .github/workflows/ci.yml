# ============================================================
# Furbiture 最小 CI
#
# 只做两件事：
#   1. 证明后端能编译、测试全绿（含 ArchUnit 架构规则 —— 规范从"散文"变成"门禁"）
#   2. 证明前端能 lint、能构建
#
# 触发条件刻意收窄为「push 到 main」+「PR」，避免 feature 分支的每次推送都烧算力。
# ============================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ----------------------------------------------------------
  # 后端：JDK 17 + Maven verify
  # ----------------------------------------------------------
  backend:
    name: Backend / JDK 17 / mvn verify
    runs-on: ubuntu-latest

    # `FurnitureApplicationTests` 是 @SpringBootTest，会加载完整上下文，
    # 因此需要能连上 MySQL 与 Redis。这里用 service container 起真实中间件
    # （端口与 application-dev.yml 一致：MySQL 3306 / Redis 6379）。
    # 若不起这些服务，contextLoads 会因连不上数据库而失败。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: furniture_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # verify = compile + test + package。
      # 其中 test 阶段会执行：
      #   - src/test/java/com/gjx/architecture/ArchitectureRulesTest（ArchUnit 架构规则）
      #   - JaCoCo 覆盖率报告（绑定在 test 阶段，产物在 target/site/jacoco/）
      # 注意：JaCoCo 目前【只度量、不设阈值】（见 pom.xml 注释），不会因覆盖率低而让 CI 变红。
      - name: Build & test (含 ArchUnit + JaCoCo)
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  # ----------------------------------------------------------
  # 前端：Node 20 + lint + build
  # ----------------------------------------------------------
  frontend:
    name: Frontend / Node 20 / lint + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 要求 package-lock.json 与 package.json 严格一致。
      # 改动依赖后必须重新 `npm install` 提交新的 lock，否则这一步会失败。
      - name: Install dependencies
        run: npm ci

      # 依赖 frontend/package.json 里的 "lint" 脚本与 frontend/eslint.config.js。
      # 这两者由另一会话落地（ESLint 引入）；脚本缺失时本步骤会报 "Missing script: lint"，
      # 属于预期内的显式失败——把"缺 lint"暴露在 CI 上，而不是被静默跳过。
      - name: Lint
        run: npm run lint

      # 必须先 build 再跑下面两个产物检查（它们读 frontend/dist，不负责触发构建）
      - name: Build
        run: npm run build

      # 检查一：模板里用到的 Element Plus 图标是否都显式 import 了。
      # main.js 已不再全量注册图标（省 135 kB），代价是漏 import 时
      # Vue 只在**运行时**打一条 "Failed to resolve component" 警告——
      # 页面照常渲染、构建不失败。这个脚本把它提前到构建期报错。
      - name: Check icon imports
        run: node ../scripts/check-icon-imports.mjs

      # 检查二：产物里是否混入了未使用的 Element Plus 组件。
      # vite.config.js 的 manualChunks 一旦给 element-plus 指定 chunk 名，
      # 它的桶文件就失去 tree-shaking，未使用组件全量进入产物（实测 +338 kB），
      # 而源码、lint、页面全部正常——只靠产物断言才能拦住。
      - name: Check bundle for unused components
        run: node ../scripts/check-bundle.mjs

      # 说明：以下两项**没有**放进 CI，原因记在这里避免反复纠结：
      #
      #   · scripts/check-entity-schema.mjs（实体字段 vs 表结构漂移）
      #     需要 MySQL。它在 CI 里必须用 TCP 连接（ubuntu 镜像自带 mysql 客户端），
      #     但本项目开发机没有 mysql CLI（一直走 `docker exec seckill-mysql`），
      #     因此这条路径**无法在本地验证**。按本项目"不发布未经实测的断言"的惯例，
      #     先不加，等有需要时连同 mysql service 一起在某个 PR 里实测通过再加。
      #     本地用法：node scripts/check-entity-schema.mjs（走 docker）
      #
      #   · 迁移脚本幂等性
      #     需要真实数据库，同上。
