# ============================================================
# 开发环境配置
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/furniture_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# JWT 配置
jwt:
  secret: furniture-dev-secret-key-2024-please-change-in-production
  expiration: 86400000  # 24小时

# 文件上传配置
file:
  upload-dir: /tmp/furniture-uploads/

# 阿里云 OSS 配置（开发环境使用本地存储）
oss:
  endpoint:
  bucket-name:
  access-key-id:
  access-key-secret:

# 日志级别
logging:
  level:
    com.gjx: debug
    org.springframework.security: debug
