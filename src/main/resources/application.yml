# ============================================================
# Furbiture（橙家优选）应用主配置文件
# 说明：通用配置，所有环境共享
# ============================================================

spring:
  application:
    name: furbiture
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson 全局配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 日志输出（开发环境开启，生产环境关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  # 实体类包路径
  type-aliases-package: com.gjx.entity
  # Mapper XML 文件路径
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '用户端'
      paths-to-match: '/api/**'
      packages-to-scan: com.gjx.controller.user
    - group: '管理端'
      paths-to-match: '/api/admin/**'
      packages-to-scan: com.gjx.controller.admin
    - group: '商家端'
      paths-to-match: '/api/merchant/**'
      packages-to-scan: com.gjx.controller.merchant

# CORS 跨域配置
cors:
  allowed-origins: http://localhost:3002,http://localhost:3003,http://localhost:3004

# 订单超时配置
order:
  timeout-minutes: 30

# 服务器端口
server:
  port: 9090
