# ============================================================
# Furbiture（橙家优选）应用主配置文件
# 说明：通用配置，所有环境共享
# ============================================================

spring:
  application:
    name: furbiture
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson 全局配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 日志格式：统一带 traceId，便于按单次请求检索全链路日志
# traceId 由 TraceIdFilter 写入 MDC，未进入过滤器（如定时任务）时显示为 "-"
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # SQL 日志默认关闭（会打印 SQL 及参数，生产环境不可开启）
    # 开发环境在 application-dev.yml 中覆盖为 StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  # 实体类包路径
  type-aliases-package: com.gjx.entity
  # Mapper XML 文件路径
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '用户端'
      paths-to-match: '/api/**'
      packages-to-scan: com.gjx.controller.user
    - group: '管理端'
      paths-to-match: '/api/admin/**'
      packages-to-scan: com.gjx.controller.admin
    - group: '商家端'
      paths-to-match: '/api/merchant/**'
      packages-to-scan: com.gjx.controller.merchant

# CORS 跨域配置
cors:
  allowed-origins: http://localhost:3002,http://localhost:3003,http://localhost:3004

# 订单超时配置
order:
  timeout-minutes: 30

# 健康检查与指标端点（仅暴露 health / info，避免泄露配置与运行时信息）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# 服务器端口
server:
  port: 9090
